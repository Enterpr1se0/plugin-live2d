name: Build jar (temp)

on:
  push:
    branches:
      - ci/build-jar
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.33.4"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Build
        run: ./gradlew clean build -Pversion=2.2.1 --console=plain

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: plugin-jar
          path: build/libs/*.jar
          retention-days: 3
